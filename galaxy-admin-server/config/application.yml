## application config
server:
  port: 8800
spring:
  application:
    name: galaxy-admin-server
  boot:
    admin:
      discovery:
        ignored-services: consul
      ui:
        title: Galaxy Data Platform
        brand: <span>Galaxy Data Platform</span>
  security:
    user:
      name: admin
      password: admin
  cloud:
    consul:
      host: 192.168.44.12
      port: 8500
      discovery:
        register: false
## management config
management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always
## log file path config
logging:
  config: ./config/logback-spring.xml