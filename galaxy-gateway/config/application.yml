## application config
server:
  port: 9999
spring:
  application:
    name: galaxy-gateway
  cloud:
    consul:
      host: 192.168.44.12
      port: 8500
      discovery:
        service-name: ${spring.application.name}
        prefer-ip-address: true
        health-check-path: /actuator/health
        instance-id: ${spring.application.name}:${spring.cloud.client.ip-address}:${server.port}
    gateway:
      routes:
        - id: demo
          uri: lb://galaxy-business-api
          predicates:
            - Path=/demo/**
        - id: metadata
          uri: lb://galaxy-query-engine
          predicates:
            - Path=/metadata/**
        - id: test
          uri: lb://galaxy-query-engine
          predicates:
            - Path=/test/**
        - id: monitor
          uri: lb://galaxy-query-engine
          predicates:
            - Path=/monitor/**
        - id: sys
          uri: lb://galaxy-query-engine
          predicates:
            - Path=/sys/**
        - id: open-api
          uri: lb://galaxy-business-api
          predicates:
            - Path=/open-api/**
        - id: knowledge
          uri: lb://galaxy-query-engine
          predicates:
            - Path=/knowledge/**
        - id: query
          uri: lb://galaxy-query-engine
          predicates:
            - Query=query
        - id: protocol
          uri: lb://galaxy-query-engine
          predicates:
            - Query=protocol
## management config
management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always
## log file path config
logging:
  config: ./config/logback-spring.xml