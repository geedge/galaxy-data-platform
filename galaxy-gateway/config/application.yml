## application config
server:
  port: 9999
spring:
  application:
    name: galaxy-gateway
  cloud:
    consul:
      host: 192.168.40.152
      port: 8500
      discovery:
        service-name: ${spring.application.name}
        prefer-ip-address: true
        health-check-path: /actuator/health
        instance-id: ${spring.application.name}:${spring.cloud.client.ip-address}:${server.port}
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: galaxydataplatform
          uri: lb://galaxy-query-engine
          predicates:
            - Path=/metadata/**
        - id: galaxydataplatform
          uri: lb://galaxy-query-engine
          predicates:
            - Path=/sys/**
        - id: galaxydataplatform
          uri: lb://galaxy-query-engine
          predicates:
            - Path=/knowledge/**
        - id: galaxydataplatform
          uri: lb://galaxy-query-engine
          predicates:
            - Query=query
        - id: galaxydataplatform
          uri: lb://galaxy-query-engine
          predicates:
            - Query=protocol
## management config
management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always
## log file path config
logging:
  config: classpath:logback-spring.xml