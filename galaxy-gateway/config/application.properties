#application config
server.port=9999
spring.application.name=galaxy-gateway
#spring cloud eureka config
eureka.instance.prefer-ip-address=true
eureka.client.registry-fetch-interval-seconds=5
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.health-check-url-path=/actuator/health
eureka.client.serviceUrl.defaultZone=http://admin:admin@127.0.0.1:8501/eureka/
eureka.instance.instance-id=${spring.cloud.client.ip-address}:${server.port}
#management config
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
#gateway config
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true
#log file path config
logging.config=./config/logback-spring.xml
#system-config-route
spring.cloud.gateway.routes[0].id=system-config-route
spring.cloud.gateway.routes[0].uri=lb://galaxy-data-engine
spring.cloud.gateway.routes[0].predicates[0]=Path=/sys/**
#metadata-route
spring.cloud.gateway.routes[1].id=metadata-route
spring.cloud.gateway.routes[1].uri=lb://galaxy-data-engine
spring.cloud.gateway.routes[1].predicates[0]=Path=/metadata/**
#sql-query-route
spring.cloud.gateway.routes[2].id=sql-query-route
spring.cloud.gateway.routes[2].uri=lb://galaxy-data-engine
spring.cloud.gateway.routes[2].predicates[0]=Query=query
#network-route
spring.cloud.gateway.routes[3].id=network-route
spring.cloud.gateway.routes[3].uri=lb://galaxy-data-engine
spring.cloud.gateway.routes[3].predicates[0]=Query=protocol
#knowledge-route
spring.cloud.gateway.routes[4].id=knowledge-route
spring.cloud.gateway.routes[4].uri=lb://galaxy-data-engine
spring.cloud.gateway.routes[4].predicates[0]=Path=/knowledge/**