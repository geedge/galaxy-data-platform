## application config
server:
  port: 8804
spring:
  application:
    name: galaxy-query-engine
  cloud:
    consul:
      host: 192.168.44.12
      port: 8500
      discovery:
        service-name: ${spring.application.name}
        prefer-ip-address: true
        health-check-path: /actuator/health
        instance-id: ${spring.application.name}:${spring.cloud.client.ip-address}:${server.port}
## management config
management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always
## log file path config
logging:
  config: ./config/logback-spring.xml
## engine config
engine:
  maxCacheNum: 1048576
  defaultResultNum: 100000
## druid config
druid:
  address: 192.168.40.152:8082
  dbname: druid
  socketTimeOut: 60000
  url: ${druid.address}/druid/v2/sql
  query: http://${druid.address}/druid/v2/sql
## clickhHouse configuration
clickhouse:
  address: 192.168.44.12:8123
  query: http://${clickhouse.address}
  url: jdbc:clickhouse://${clickhouse.address}
  driverClassName: ru.yandex.clickhouse.ClickHouseDriver
  dbname: tsg_galaxy_v3
  realTimeAccount:
    username: tsg_query
    password: ceiec2018
    socketTimeOut: 60000
  longTermAccount:
    username: tsg_report
    password: ceiec2019
    socketTimeOut: 21700000
## hbase configuration
hbase:
  zookeeperQuorum: 192.168.44.12
  zookeeperPropertyClientPort: 2181
  zookeeperZnodeParent: /hbase
  dbname: tsg
  tableName: report_result
  columnFamily: response
  columnName: result
  clientIpcPoolSize: 60
  rpcTimeout: 60000
## xxl-job-admin configuration
xxl-job-admin:
  url: http://192.168.44.12:8181/xxl-job-admin
  userName: query
  password: ceiec2018
## arangoDB configuration
arango:
  server: http://192.168.44.12:8529
  database: tsg_galaxy_v3
  username: query
  password: ceiec2018
  jwturl: ${arango.server}/_db/${arango.database}/_open/auth
  queryurl: ${arango.server}/_db/${arango.database}/_api/cursor
  maxrows: 10000
  socketTimeOut: 300000
## http pool config
http:
  pool:
    connect:
      timeout: 30000
    max:
      connection: 500
      per:
        route: 200
    request:
      timeout: 10000
    response:
      timeout: 10000