## application config
server:
  port: 8802
spring:
  application:
    name: galaxy-business-api
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.44.3:3306/tsg-bifang?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
    username: root
    password: 111111
  cloud:
    consul:
      host: 192.168.44.12
      port: 8500
