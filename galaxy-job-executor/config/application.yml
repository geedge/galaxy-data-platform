## application config
server:
  port: 8805
  servlet:
    context-path: /galaxy-job-executor
spring:
  application:
    name: galaxy-job-executor
  kafka:
    bootstrap-servers: 192.168.44.12:9092
  cloud:
    consul:
      host: 192.168.44.12
      port: 8500
      discovery:
        service-name: ${spring.application.name}
        prefer-ip-address: true
        health-check-path: /${spring.application.name}/actuator/health
        instance-id: ${spring.application.name}:${spring.cloud.client.ip-address}:${server.port}
        tags: management.context-path=/${spring.application.name}/actuator
## management config
management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always
## log file path config
logging:
  config: ./config/logback-spring.xml
## http connect config
http:
  pool:
    connect:
      timeout: 30000
    max:
      connection: 500
      per:
        route: 300
    request:
      timeout: 120000
    response:
      timeout: 120000
## galaxy-job config
galaxy:
  job:
    accessToken: ''
    admin:
      addresses: http://localhost:8804/galaxy-job-admin
    executor:
      address: ''
      appname: ${spring.application.name}
      ip: ''
      logpath: /data/logs/jobhandler
      logretentiondays: 30
      port: 8886
